name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish"
        required: true
        default: "v1.3"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Capture release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_name=CreateIT-${TAG}.dmg" >> "$GITHUB_OUTPUT"
          echo "release_name=CreateIT ${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project CreateIT.xcodeproj \
            -scheme CreateIT \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/CreateITDerivedData" \
            clean build

      - name: Package DMG
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/CreateITDerivedData/Build/Products/Release/CreateIT.app"
          STAGING_DIR="$RUNNER_TEMP/CreateITRelease"
          DMG_PATH="$GITHUB_WORKSPACE/dist/${{ steps.meta.outputs.dmg_name }}"

          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR" "$GITHUB_WORKSPACE/dist"
          cp -R "$APP_PATH" "$STAGING_DIR/"

          hdiutil create \
            -srcfolder "$STAGING_DIR" \
            -volname "CreateIT" \
            -format UDZO \
            -ov "$DMG_PATH"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/${{ steps.meta.outputs.dmg_name }}
